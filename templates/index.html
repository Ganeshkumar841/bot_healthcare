<!DOCTYPE html>
<html lang="en" class="light"> <!-- Default to light mode -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArogyaMitra AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Set Tailwind dark mode to use the 'class' strategy
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        #chat-box::-webkit-scrollbar {
            width: 6px;
        }
        #chat-box::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5);
            border-radius: 20px;
            border: 3px solid transparent;
        }

        /* Prose adjustments for chat bubbles */
        .prose p { margin-bottom: 0.75rem; }
        .prose ul, .prose ol { margin-left: 1.25rem; margin-bottom: 0.75rem; }
        .prose li { margin-bottom: 0.25rem; }
        .prose h3 { margin-top: 1em; margin-bottom: 0.5em; font-size: 1.1em; }

        /* --- NEW STYLES FOR FEATURES --- */

        /* 1. Message Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-animate {
            animation: fadeIn 0.3s ease-out forwards;
        }

        /* 2. Enhanced Typing Indicator (Skeleton Loader) */
        @keyframes pulse-bg {
            0%, 100% { background-color: #e5e7eb; }
            50% { background-color: #d1d5db; }
        }
        .dark @keyframes pulse-bg {
            0%, 100% { background-color: #374151; }
            50% { background-color: #4b5563; }
        }
        .skeleton-line {
            animation: pulse-bg 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* 3. Recording/Pulse animation for Mic Button */
        .recording {
            color: #ef4444; /* red-500 */
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.4); /* red-500 with opacity */
            animation: pulse-mic 1.5s infinite;
        }
        @keyframes pulse-mic {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 antialiased transition-colors duration-300">

<div class="flex flex-col h-screen max-w-3xl mx-auto px-4">
    <header class="py-6 text-center">
        <div class="flex items-center justify-center gap-4 relative">
            <!-- Settings Button -->
            <button id="settings-btn" class="absolute left-0 p-2 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-gray-100 dark:focus:ring-offset-gray-900 transition-all">
                <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-1.007 1.11-1.226.554-.22 1.19-.22 1.745 0 .56.22 1.02.684 1.11 1.226M15 9.75a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </button>
            <h1 id="ui-title" class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 to-purple-600">
                ArogyaMitra AI
            </h1>
            <div class="absolute right-0 flex items-center gap-2">
                <!-- Theme Toggle -->

                    <svg id="theme-icon-sun" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="theme-icon-moon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
                <!-- Language Selector -->
                <div class="relative">
                    <select id="language-selector" class="hidden">
                        <option value="en-US">English</option>
                        <option value="es-ES">Español</option>
                        <option value="hi-IN">हिन्दी</option>
                        <option value="fr-FR">Français</option>
                        <option value="de-DE">Deutsch</option>
                        <option value="te-IN">తెలుగు</option>
                        <option value="ta-IN">தமிழ்</option>
                        <option value="or-IN">ଓଡିଆ</option>
                        <option value="bn-IN">বাংলা</option>
                        <option value="mr-IN">मराठी</option>
                        <option value="gu-IN">ગુજરાતી</option>

                    <button id="language-selector-button" class="flex items-center gap-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-gray-100 dark:focus:ring-offset-gray-900 p-2.5 transition-colors">
                        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>

                </div>
            </div>
        </div>
        <p id="ui-subtitle" class="text-gray-500 dark:text-gray-400 mt-2">Trusted Health Guidance, Anytime, Anywhere</p>
    </header>

    <main id="chat-box" class="flex-1 overflow-y-auto pr-2 space-y-6">
        <!-- Welcome Message -->
        <div class="bot-message flex items-start gap-3 message-animate">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex-shrink-0 flex items-center justify-center text-white">

                <p>Welcome. I'm your AI Health Advisor. Ask me anything about symptoms, conditions, fitness, or nutrition.</p>
            </div>
        </div>
        <!-- Chat messages will be appended here -->
    </main>

    <!-- Quick Reply Container -->
    <div id="quick-reply-box" class="py-2 flex items-center justify-center flex-wrap gap-2"></div>

    <footer class="py-4">
        <div id="image-preview-container" class="relative hidden w-24 h-24 mb-2 p-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800">

            <button id="upload-btn" class="p-4 text-gray-500 dark:text-gray-400 hover:text-indigo-500 dark:hover:text-indigo-400 transition-colors focus:outline-none">

</div>

<!-- Settings Modal -->

        </div>
        <div class="mt-6 flex justify-end gap-3">

            <button id="save-settings-btn" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition">Save</button>
        </div>
    </div>
</div>

        'mr-IN': { title: "आरोग्यमित्र AI", subtitle: "तुमचे मैत्रीपूर्ण AI-चालित आरोग्य संसाधन", welcome: "<p>स्वागत आहे. मी तुमचा AI आरोग्य सल्लागार आहे. मला लक्षणे, परिस्थिती, फिटनेस किंवा पोषणाबद्दल काहीही विचारा.</p>", placeholder: "आरोग्य विषयाबद्दल विचारा...", listening: "ऐकत आहे... आता बोला." },
        'gu-IN': { title: "આરોગ્યમિત્ર AI", subtitle: "તમારું મૈત્રીપૂર્ણ AI-સંચાલિત આરોગ્ય સંસાધન", welcome: "<p>સ્વાગત છે. હું તમારો AI આરોગ્ય સલાહકાર છું. મને લક્ષણો, પરિસ્થિતિઓ, ફિટનેસ અથવા પોષણ વિશે કંઈપણ પૂછો.</p>", placeholder: "આરોગ્ય વિષય વિશે પૂછો...", listening: "સાંભળી રહ્યો છું... હવે બોલો." },
        'kn-IN': { title: "ಆರೋಗ್ಯಮಿತ್ರ AI", subtitle: "ನಿಮ್ಮ ಸ್ನೇಹಪರ AI-ಚಾಲಿತ ಆರೋಗ್ಯ ಸಂಪನ್ಮೂಲ", welcome: "<p>ಸ್ವಾಗತ. ನಾನು ನಿಮ್ಮ AI ಆರೋಗ್ಯ ಸಲಹೆಗಾರ. ರೋಗಲಕ್ಷಣಗಳು, ಪರಿಸ್ಥಿತಿಗಳು, ಫಿಟ್ನೆಸ್ ಅಥವಾ ಪೋಷಣೆಯ ಬಗ್ಗೆ ನನ್ನನ್ನು ಏನು ಬೇಕಾದರೂ ಕೇಳಿ.</p>", placeholder: "ಆರೋಗ್ಯ ವಿಷಯದ ಬಗ್ಗೆ ಕೇಳಿ...", listening: "ಕೇಳುತ್ತಿದೆ... ಈಗ ಮಾತನಾಡಿ." }
    };

    // ========================================================================
    // 1. Core Functions (Messaging, UI Updates)
    // ========================================================================

    const addMessage = (content, type, audioData = null, imageData = null) => {
        const messageId = `msg-${Date.now()}`;
        const messageWrapper = document.createElement("div");
        messageWrapper.className = `${type}-message flex items-start gap-3 message-animate`;
        if (type === 'user') {
             messageWrapper.classList.add('justify-end');
        }
        
        let messageHTML = '';
        
        const controls = `
            <div class="flex items-center gap-2 mt-2">
                <button class="copy-btn p-1 text-gray-400 hover:text-indigo-500 transition-colors" title="Copy text" data-clipboard-target="#${messageId}-content">
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" /></svg>
                </button>
                <button class="feedback-btn p-1 text-gray-400 hover:text-green-500 transition-colors" title="Good response">
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.633 10.5c.806 0 1.533-.446 2.031-1.08a9.041 9.041 0 012.861-2.4c.723-.384 1.35-.956 1.653-1.715a4.498 4.498 0 00.322-1.672V3a.75.75 0 01.75-.75A2.25 2.25 0 0116.5 4.5c0 1.152-.26 2.243-.723 3.218-.266.558.107 1.282.725 1.282h3.126c1.026 0 1.945.694 2.054 1.715.045.422.068.85.068 1.285a11.95 11.95 0 01-2.649 7.521c-.388.482-.987.729-1.605.729H13.48c-.483 0-.964-.078-1.423-.23l-3.114-1.04a4.501 4.501 0 00-1.423-.23H5.25a2.25 2.25 0 01-2.25-2.25v-6.75a2.25 2.25 0 012.25-2.25h1.383z" /></svg>
                </button>
                <button class="feedback-btn p-1 text-gray-400 hover:text-red-500 transition-colors" title="Bad response">
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 15h1.125c.621 0 1.125-.504 1.125-1.125v-6.75a1.125 1.125 0 00-1.125-1.125H7.5" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 8.25c-.806 0-1.533.446-2.031 1.08a9.041 9.041 0 00-2.861 2.4c-.723.384-1.35.956-1.653 1.715a4.498 4.498 0 00-.322 1.672v1.75a.75.75 0 00.75.75A2.25 2.25 0 0016.5 18c0-1.152-.26-2.243-.723-3.218-.266-.558.107-1.282.725-1.282h3.126c1.026 0 1.945-.694 2.054-1.715.045-.422.068.85.068-1.285a11.95 11.95 0 00-2.649-7.521c-.388-.482-.987.729-1.605.729H13.48c-.483 0-.964-.078-1.423-.23l-3.114 1.04a4.501 4.501 0 00-1.423-.23H5.25a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25h1.383z" /></svg>
                </button>
                ${audioData ? `<button class="speaker-btn p-1 text-gray-400 hover:text-indigo-500 transition-colors" title="Play audio" onclick="playAudio('${audioData}')">
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" /></svg>
                </button>` : ''}
            </div>`;

        content = content.replace(/!\[video\]\((.*?)\)/g, (match, url) => {
            const videoId = url.includes('youtube.com/embed/') ? url.split('embed/')[1] : null;
            if (!videoId) return '';
            return `<div class="aspect-w-16 aspect-h-9 my-4 rounded-lg overflow-hidden"><iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
        });

        if (type === 'user') {
            const imageHTML = imageData ? `<img src="${imageData}" class="mt-2 rounded-lg max-w-xs max-h-48 object-contain self-end">` : '';
            messageHTML = `
                <div class="prose max-w-none bg-indigo-500 text-white rounded-lg p-4 rounded-br-none shadow-sm flex flex-col items-start">
                    <p>${content}</p>
                    ${imageHTML}
                </div>
                <div class="w-8 h-8 rounded-full bg-gray-200 dark:bg-gray-700 flex-shrink-0 flex items-center justify-center text-gray-500 dark:text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>`;
        } else {
            messageHTML = `
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex-shrink-0 flex items-center justify-center text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="m12 14-4-4"/><path d="M12 21a9 9 0 0 0 0-18 9 9 0 0 0 0 18Z"/></svg>
                </div>
                <div class="flex flex-col">
                    <div class="prose max-w-none bg-white dark:bg-gray-800 rounded-lg p-4 rounded-tl-none shadow-sm border border-gray-200 dark:border-gray-700">
                        <div id="${messageId}-content" class="text-gray-800 dark:text-gray-200">${content}</div>
                    </div>
                    ${controls}
                </div>`;
        }
        messageWrapper.innerHTML = messageHTML;
        chatBox.appendChild(messageWrapper);
        chatBox.scrollTop = chatBox.scrollHeight;
    };

    const showTypingIndicator = () => {
        const typingIndicatorHTML = `
            <div id="typing-indicator" class="bot-message flex items-start gap-3 message-animate">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex-shrink-0 flex items-center justify-center text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="m12 14-4-4"/><path d="M12 21a9 9 0 0 0 0-18 9 9 0 0 0 0 18Z"/></svg>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-lg p-4 rounded-tl-none flex flex-col space-y-2 shadow-sm border border-gray-200 dark:border-gray-700 w-48">
                    <div class="skeleton-line h-3 w-5/6 rounded"></div>
                    <div class="skeleton-line h-3 w-full rounded"></div>
                    <div class="skeleton-line h-3 w-4/6 rounded"></div>
                </div>
            </div>`;
        chatBox.insertAdjacentHTML('beforeend', typingIndicatorHTML);
        chatBox.scrollTop = chatBox.scrollHeight;
    };

    const hideTypingIndicator = () => {
        const indicator = document.getElementById("typing-indicator");
        if (indicator) indicator.remove();
    };

    const handleSend = async (source = 'text', questionOverride = null) => {
        const question = questionOverride || userInput.value.trim();
        if (!question && !imageBase64) return; // Allow sending with only an image

        stopAudio();
        clearQuickReplies();

        const userMessageText = question || "Image uploaded. Please analyze.";
        addMessage(userMessageText, 'user', null, imageBase64);

        const sentImageBase64 = imageBase64;
        
        userInput.value = "";
        sendBtn.disabled = true;
        removeImage();

        showTypingIndicator();

        try {
            const response = await fetch("/ask", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question: question,
                    language: languageSelector.value,
                    source: source,
                    userName: userName,
                    imageBase64: sentImageBase64
                }),
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({ error: `HTTP error! status: ${response.status}`}));
                throw new Error(errData.error);
            }

            const data = await response.json();
            const botAnswer = data.answer;
            const audioData = data.audio;
            const quickReplies = data.quick_replies;

            hideTypingIndicator();
            addMessage(marked.parse(botAnswer), 'bot', audioData);

            if (audioData) playAudio(audioData);
            if (quickReplies && quickReplies.length > 0) renderQuickReplies(quickReplies);

        } catch (error) {
            console.error("Error fetching response:", error);
            hideTypingIndicator();
            addMessage(`Sorry, something went wrong. Please check the server or try again. <br><small class="text-red-500">${error.message}</small>`, 'bot');
        } finally {
            sendBtn.disabled = false;
            userInput.focus();
        }
    };
    
    // ========================================================================
    // 2. Feature Functions 
    // ========================================================================

    const renderQuickReplies = (replies) => {
        quickReplyBox.innerHTML = '';
        replies.forEach(reply => {
            const button = document.createElement('button');
            button.textContent = reply;
            button.className = "px-4 py-2 bg-indigo-100 dark:bg-gray-700 text-indigo-700 dark:text-gray-200 rounded-full text-sm hover:bg-indigo-200 dark:hover:bg-gray-600 transition-colors";
            button.onclick = () => handleQuickReplyClick(reply);
            quickReplyBox.appendChild(button);
        });
    };

    const handleQuickReplyClick = (text) => {
        handleSend('text', text);
    };

    const clearQuickReplies = () => {
        quickReplyBox.innerHTML = '';
    };

    const loadUserProfile = () => {
        const savedName = localStorage.getItem('arogyaMitraUserName');
        if (savedName) {
            userName = savedName;
            nameInput.value = savedName;
        }
    };

    const stopAudio = () => {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
            currentAudio = null;
            stopBtn.classList.add('hidden');
        }
    };
    window.playAudio = (base64String) => {
        stopAudio();
        const audioSource = `data:audio/mp3;base64,${base64String}`;
        currentAudio = new Audio(audioSource);
        currentAudio.play();
        stopBtn.classList.remove('hidden');
        currentAudio.onended = stopAudio;
    };

    const handleImageUpload = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            imageBase64 = e.target.result;
            imagePreview.src = imageBase64;
            imagePreviewContainer.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
    };

    const removeImage = () => {
        imageBase64 = null;
        imagePreview.src = '';
        imagePreviewContainer.classList.add('hidden');
        imageUploadInput.value = ''; // Reset file input
    };

    const getCurrentStrings = () => uiStrings[languageSelector.value] || uiStrings['en-US'];

    const setLanguage = (lang) => {
        const strings = uiStrings[lang] || uiStrings['en-US'];
        const selectedOption = Array.from(languageSelector.options).find(opt => opt.value === lang);
        document.getElementById('ui-title').innerText = strings.title;
        document.getElementById('ui-subtitle').innerText = strings.subtitle;
        document.getElementById('ui-welcome').innerHTML = strings.welcome;
        userInput.placeholder = strings.placeholder;
        selectedLanguageLabel.innerText = selectedOption ? selectedOption.text : 'English';
    };

    const applyTheme = (theme) => {
        document.documentElement.classList.toggle('dark', theme === 'dark');
        themeIconSun.classList.toggle('hidden', theme === 'dark');
        themeIconMoon.classList.toggle('hidden', theme !== 'dark');
    };
    
    const populateLanguageDropdown = () => {
        languageDropdown.innerHTML = '';
        Array.from(languageSelector.options).forEach(option => {
            const item = document.createElement('a');
            item.href = '#';
            item.textContent = option.textContent;
            item.dataset.value = option.value;
            item.className = 'block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-indigo-500 hover:text-white dark:hover:bg-indigo-500 transition-colors';
            item.addEventListener('click', (e) => {
                e.preventDefault();
                languageSelector.value = item.dataset.value;
                setLanguage(item.dataset.value);
                languageDropdown.classList.add('hidden');
            });
            languageDropdown.appendChild(item);
        });
    };
    
    // ========================================================================
    // 3. Event Listeners & Initialization
    // ========================================================================
    
    document.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        applyTheme(savedTheme);

        populateLanguageDropdown();
        setLanguage('en-US');

        loadUserProfile();
    });

    sendBtn.addEventListener("click", () => handleSend('text'));
    userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            handleSend('text');
        }
    });
    
    stopBtn.addEventListener('click', stopAudio);
    
    settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
    closeModalBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));
    saveSettingsBtn.addEventListener('click', () => {
        userName = nameInput.value.trim();
        localStorage.setItem('arogyaMitraUserName', userName);
        settingsModal.classList.add('hidden');
    });

    uploadBtn.addEventListener('click', () => imageUploadInput.click());
    imageUploadInput.addEventListener('change', handleImageUpload);
    removeImageBtn.addEventListener('click', removeImage);

    chatBox.addEventListener('click', (e) => {
        const copyBtn = e.target.closest('.copy-btn');
        const feedbackBtn = e.target.closest('.feedback-btn');

        if (copyBtn) {
            const targetId = copyBtn.dataset.clipboardTarget;
            const contentElement = document.querySelector(targetId);
            if (contentElement) {
                navigator.clipboard.writeText(contentElement.innerText)
                    .then(() => {
                        copyBtn.innerHTML = '<svg class="w-4 h-4 text-green-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>';
                        setTimeout(() => {
                            copyBtn.innerHTML = '<svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" /></svg>';
                        }, 1500);
                    });
            }
        }

        if (feedbackBtn) {
            const otherBtn = feedbackBtn.parentElement.querySelector('.feedback-btn.text-green-500, .feedback-btn.text-red-500');
            if (otherBtn && otherBtn !== feedbackBtn) {
                 otherBtn.classList.remove('text-green-500', 'text-red-500');
            }
            feedbackBtn.classList.toggle(feedbackBtn.title.includes('Good') ? 'text-green-500' : 'text-red-500');
        }
    });
    
    themeToggle.addEventListener('click', () => {
        const newTheme = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
        localStorage.setItem('theme', newTheme);
        applyTheme(newTheme);
    });
    
    languageSelectorButton.addEventListener('click', (e) => {
        e.stopPropagation();
        languageDropdown.classList.toggle('hidden');
    });

    document.addEventListener('click', (e) => {
        if (!languageSelectorButton.contains(e.target) && !languageDropdown.contains(e.target)) {
            languageDropdown.classList.add('hidden');
        }
    });
        
    // --- Speech Recognition Logic ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isRecording = false;
    let silenceTimeout;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
            isRecording = true;
            micBtn.classList.add('recording');
            userInput.placeholder = getCurrentStrings().listening;
            sendBtn.disabled = true;
        };

        recognition.onresult = (event) => {
            clearTimeout(silenceTimeout);
            let interimTranscript = '';
            let finalTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            userInput.value = finalTranscript + interimTranscript;
            
            silenceTimeout = setTimeout(() => {
                if(isRecording) recognition.stop();
            }, 3000); // Stop after 3 seconds of silence
        };

        recognition.onerror = (event) => {
            console.error("Speech recognition error:", event.error);
            addMessage(`Sorry, a speech recognition error occurred: ${event.error}`, 'bot');
        };

        recognition.onend = () => {
            isRecording = false;
            micBtn.classList.remove('recording');
            userInput.placeholder = getCurrentStrings().placeholder;
            sendBtn.disabled = false;
            clearTimeout(silenceTimeout);

            if (userInput.value.trim()) {
                handleSend('voice');
            }
        };

    } else {
        console.log("Speech Recognition not supported in this browser.");
        micBtn.disabled = true;
        micBtn.title = "Speech recognition not supported";
    }

    micBtn.addEventListener('click', () => {
        if (!SpeechRecognition) return;
        if (isRecording) {
            recognition.stop();
        } else {
            stopAudio();
            recognition.lang = languageSelector.value;
            recognition.start();
        }
    });

</script>
</body>
</html>
