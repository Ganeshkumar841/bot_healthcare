<!DOCTYPE html>
<!-- ADDED h-full -->
<html lang="en" class="light h-full"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArogyaMitra AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Set Tailwind dark mode to use the 'class' strategy
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        #chat-box::-webkit-scrollbar, .country-list::-webkit-scrollbar, #chat-history-list::-webkit-scrollbar {
            width: 6px;
        }
        #chat-box::-webkit-scrollbar-track, .country-list::-webkit-scrollbar-track, #chat-history-list::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-box::-webkit-scrollbar-thumb, .country-list::-webkit-scrollbar-thumb, #chat-history-list::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5);
            border-radius: 20px;
        }
        /* Prose adjustments for chat bubbles */
        .prose p { margin-bottom: 0.75rem; }
        .prose ul, .prose ol { margin-left: 1.25rem; margin-bottom: 0.75rem; }
        .prose li { margin-bottom: 0.25rem; }
        .prose h3 { margin-top: 1em; margin-bottom: 0.5em; font-size: 1.1em; }

        /* --- STYLES FOR FEATURES --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-animate {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes pulse-bg {
            0%, 100% { background-color: #e5e7eb; }
            50% { background-color: #d1d5db; }
        }
        .dark @keyframes pulse-bg {
            0%, 100% { background-color: #374151; }
            50% { background-color: #4b5563; }
        }
        .skeleton-line {
            animation: pulse-bg 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .recording {
            color: #ef4444;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.4);
            animation: pulse-mic 1.5s infinite;
        }
        @keyframes pulse-mic {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        
        /* --- NEW UI STYLES FOR SIDEBAR TOGGLE --- */
        body.sidebar-open #history-sidebar {
            transform: translateX(0);
        }
        body.sidebar-open #sidebar-overlay {
            display: block;
        }
        @media (min-width: 1024px) { /* lg breakpoint */
            body.sidebar-open #main-content {
                padding-left: 16rem; /* w-64 */
            }
        }
    </style>
</head>
<!-- ADDED h-full and overflow-hidden -->
<body id="app-wrapper" class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 antialiased transition-colors duration-300 h-full overflow-hidden"> 

<!-- Auth Container - Shown when logged out -->

        <div class="my-6 flex items-center"><div class="flex-grow border-t border-gray-300 dark:border-gray-600"></div><span class="mx-4 text-sm font-medium text-gray-400 dark:text-gray-500">OR</span><div class="flex-grow border-t border-gray-300 dark:border-gray-600"></div></div>

        <!-- Email/Password Login Section -->
        <div id="email-login-section">
            <form id="email-form" class="space-y-4">
                <input type="email" id="email-input" placeholder="Email address" class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>

                    <button type="submit" id="email-signin-btn" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition-colors">Sign In</button>
                    <button type="submit" id="email-signup-btn" class="w-full py-3 px-4 bg-gray-600 hover:bg-gray-700 text-white rounded-lg transition-colors">Sign Up</button>

        <p id="auth-error" class="text-red-500 text-sm mt-2 text-center hidden"></p>

</div>

    // ========================================================================

    const saveChat = async () => {
        if (!currentUserId || messages.length <= 1) return;

        const existingChatIndex = chatHistory.findIndex(chat => chat.id === currentChatId);
        let chatTitle;

        if (existingChatIndex > -1 && chatHistory[existingChatIndex].title && chatHistory[existingChatIndex].title !== 'New Chat') {
            chatTitle = chatHistory[existingChatIndex].title;
        } else {
            const userMessages = messages.filter(m => m.type === 'user' && m.content);
            let titleSource = '';
            if (userMessages.length > 0) {
                titleSource = userMessages.reduce((a, b) => a.content.length > b.content.length ? a : b).content;
            } else if (messages.length > 1) {
                const firstMeaningfulBotResponse = messages.find((m, index) => m.type === 'bot' && index > 0);
                if (firstMeaningfulBotResponse) titleSource = firstMeaningfulBotResponse.content;
            }
            chatTitle = titleSource ? titleSource.substring(0, 40) + (titleSource.length > 40 ? '...' : '') : 'New Chat';
        }

        const chatData = {
            id: currentChatId,
            title: chatTitle,
            messages: messages,
            timestamp: Date.now()
        };

        try {
            const chatDocRef = doc(db, 'users', currentUserId, 'chats', currentChatId);
            await setDoc(chatDocRef, chatData);
            
            if (existingChatIndex > -1) {
                chatHistory[existingChatIndex] = chatData;
            } else {
                chatHistory.unshift(chatData);
            }
            chatHistory.sort((a, b) => b.timestamp - a.timestamp);
            renderChatHistoryList();

        } catch (error) {
            console.error("Error saving chat:", error);
        }
    };
    
    const loadChatHistory = async () => {
        if (!currentUserId) return;
        try {
            const chatsRef = collection(db, 'users', currentUserId, 'chats');
            const q = query(chatsRef, orderBy('timestamp', 'desc'));
            const querySnapshot = await getDocs(q);
            chatHistory = querySnapshot.docs.map(doc => doc.data());
            renderChatHistoryList();
        } catch (error) {
            console.error("Error loading chat history:", error);
            chatHistory = [];
            renderChatHistoryList();
        }
    };

    const renderChatHistoryList = (filter = '') => {
        chatHistoryList.innerHTML = '';
        const filteredHistory = chatHistory.filter(chat => chat.title.toLowerCase().includes(filter.toLowerCase()));

        if (filteredHistory.length === 0) {
            chatHistoryList.innerHTML = `<p class="text-sm text-gray-500 dark:text-gray-400 p-3">No recent chats.</p>`;
            return;
        }

        filteredHistory.forEach(chat => {
            const item = document.createElement('div');
            item.className = `group flex items-center justify-between p-3 rounded-lg cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors ${chat.id === currentChatId ? 'bg-indigo-100 dark:bg-indigo-900/50' : ''}`;

                </div>
            `;
            
            item.addEventListener('click', (e) => {
                if (!e.target.closest('button')) {
                    loadChat(chat.id);
                }
            });

            item.querySelector('.rename-chat-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                renameChat(chat.id, chat.title);
            });
            item.querySelector('.delete-chat-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                deleteChat(chat.id);
            });

            chatHistoryList.appendChild(item);
        });
    };
    
    const loadChat = (chatId) => {
        saveChat();
        
        const chat = chatHistory.find(c => c.id === chatId);
        if (!chat) return;
        
        stopAudio();
        clearQuickReplies();
        chatBox.innerHTML = '';
        messages = [...chat.messages];

    const renameChat = async (chatId, oldTitle) => {
        const newTitle = prompt("Enter a new name for this chat:", oldTitle.replace('...', ''));
        if (newTitle && newTitle.trim() !== "") {
            try {
                const trimmedTitle = newTitle.trim();
                const chatDocRef = doc(db, 'users', currentUserId, 'chats', chatId);
                await setDoc(chatDocRef, { title: trimmedTitle }, { merge: true });

                const chatIndex = chatHistory.findIndex(c => c.id === chatId);
                if (chatIndex > -1) {
                    chatHistory[chatIndex].title = trimmedTitle;
                    renderChatHistoryList();
                }
            } catch (error) {
                console.error("Error renaming chat:", error);
            }
        }
    };
    
    const deleteChat = async (chatId) => {

                }
                renderChatHistoryList();

                console.error("Error deleting chat:", error);
            }

    const clearAllChats = async () => {

            try {
                const chatsRef = collection(db, 'users', currentUserId, 'chats');

                const batch = writeBatch(db);

                await batch.commit();

                chatHistory = [];
                startNewChat();
            } catch (error) {
                console.error("Error clearing all chats: ", error);
            }
        }
    }

            <div class="flex items-center gap-2 mt-2">
                <button class="copy-btn p-1 text-gray-400 hover:text-indigo-500 transition-colors" title="Copy text" data-clipboard-target="#${messageId}-content"><svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" /></svg></button>
                ${audioData ? `<button class="speaker-btn p-1 text-gray-400 hover:text-indigo-500 transition-colors" title="Play audio" onclick="playAudio('${audioData}')"><svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" /></svg></button>` : ''}
            </div>`;

        let messageHTML = '';
        if (type === 'user') {
            const imageHTML = imageData ? `<img src="${imageData}" class="mt-2 rounded-lg max-w-xs max-h-48 object-contain self-end">` : '';
            messageHTML = `<div class="prose max-w-none bg-indigo-500 text-white rounded-lg p-4 rounded-br-none shadow-sm flex flex-col items-start"><p>${content}</p>${imageHTML}</div><div class="w-8 h-8 rounded-full bg-gray-200 dark:bg-gray-700 flex-shrink-0 flex items-center justify-center text-gray-500 dark:text-gray-400"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>`;
        } else {
            messageHTML = `<div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex-shrink-0 flex items-center justify-center text-white"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="m12 14-4-4"/><path d="M12 21a9 9 0 0 0 0-18 9 9 0 0 0 0 18Z"/></svg></div><div class="flex flex-col"><div class="prose max-w-none bg-white dark:bg-gray-800 rounded-lg p-4 rounded-tl-none shadow-sm border border-gray-200 dark:border-gray-700"><div id="${messageId}-content" class="text-gray-800 dark:text-gray-200">${content}</div></div>${controls}</div>`;
        }
        messageWrapper.innerHTML = messageHTML;
        chatBox.appendChild(messageWrapper);
        chatBox.scrollTop = chatBox.scrollHeight;
    };

    const addMessageToState = (content, type, audioData = null, imageData = null, isMarkdown = false) => {
        messages.push({ content, type, audio: audioData, image: imageData, timestamp: Date.now(), isMarkdown });
        addMessage(isMarkdown ? marked.parse(content) : content, type, audioData, imageData);
    }

    const showTypingIndicator = () => {
        const typingIndicatorHTML = `<div id="typing-indicator" class="bot-message flex items-start gap-3 message-animate"><div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex-shrink-0 flex items-center justify-center text-white"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="m12 14-4-4"/><path d="M12 21a9 9 0 0 0 0-18 9 9 0 0 0 0 18Z"/></svg></div><div class="bg-white dark:bg-gray-800 rounded-lg p-4 rounded-tl-none flex flex-col space-y-2 shadow-sm border border-gray-200 dark:border-gray-700 w-48"><div class="skeleton-line h-3 w-5/6 rounded"></div><div class="skeleton-line h-3 w-full rounded"></div><div class="skeleton-line h-3 w-4/6 rounded"></div></div></div>`;
        chatBox.insertAdjacentHTML('beforeend', typingIndicatorHTML);
        chatBox.scrollTop = chatBox.scrollHeight;
    };

    const hideTypingIndicator = () => {
        const indicator = document.getElementById("typing-indicator");
        if (indicator) indicator.remove();
    };

    const handleSend = async (source = 'text', questionOverride = null) => {
        const question = questionOverride || userInput.value.trim();
        if ((!question && !imageBase64) || !currentUserId) return;

        stopAudio();
        clearQuickReplies();
        const userMessageText = question || "Image uploaded. Please analyze.";
        addMessageToState(userMessageText, 'user', null, imageBase64);
        
        const sentImageBase64 = imageBase64;
        userInput.value = "";
        sendBtn.disabled = true;
        removeImage();
        showTypingIndicator();

        try {
            // NOTE: This fetch call is to a relative path "/ask".
            // This assumes a backend server is running on the same origin.
            // This will not work as a standalone file without a backend.
            const response = await fetch("/ask", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    userId: currentUserId, 
                    question: question, 
                    language: languageSelector.value, 
                    source: source, 
                    userName: userName, 
                    imageBase64: sentImageBase64,
                    chatHistory: messages
                }),
            });
            if (!response.ok) {
                const errData = await response.json().catch(() => ({ error: `HTTP error! status: ${response.status}`}));
                throw new Error(errData.error || 'Failed to fetch');
            }
            const data = await response.json();
            hideTypingIndicator();
            addMessageToState(data.answer, 'bot', data.audio, null, true);
            
            if (data.audio) playAudio(data.audio);
            if (data.quick_replies?.length > 0) renderQuickReplies(data.quick_replies);
            
            await saveChat();

        } catch (error) {
            console.error("Error fetching response:", error);
            hideTypingIndicator();
            // Simulating a backend error for frontend-only demo
            const errorMsg = `Sorry, I couldn't connect to the server. (Error: ${error.message}). Please check your connection or try again later.`;
            addMessageToState(errorMsg, 'bot', null, null, true);
        } finally {
            sendBtn.disabled = userInput.value.trim() === '' && !imageBase64;
            userInput.focus();
        }
    };
    
    const renderQuickReplies = (replies) => {
        quickReplyBox.innerHTML = '';
        replies.forEach(reply => {
            const button = document.createElement('button');
            button.textContent = reply;
            button.className = "px-4 py-2 bg-indigo-100 dark:bg-gray-700 text-indigo-700 dark:text-gray-200 rounded-full text-sm hover:bg-indigo-200 dark:hover:bg-gray-600 transition-colors";
            button.onclick = () => handleSend('text', reply);
            quickReplyBox.appendChild(button);
        });
    };

    const clearQuickReplies = () => { quickReplyBox.innerHTML = ''; };
    const loadUserProfile = () => {
        userName = localStorage.getItem('arogyaMitraUserName');
        if (userName) nameInput.value = userName;
    };
    const stopAudio = () => {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
            currentAudio = null;
            stopBtn.classList.add('hidden');
        }
    };
    window.playAudio = (base64String) => {
        stopAudio();
        currentAudio = new Audio(`data:audio/mp3;base64,${base64String}`);
        currentAudio.play();
        stopBtn.classList.remove('hidden');
        currentAudio.onended = stopAudio;
    };
    const handleImageUpload = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            imageBase64 = e.target.result;
            imagePreview.src = imageBase64;
            imagePreviewContainer.classList.remove('hidden');
            sendBtn.disabled = false;
        };
        reader.readAsDataURL(file);
    };
    const removeImage = () => {
        imageBase64 = null;
        imagePreview.src = '';
        imagePreviewContainer.classList.add('hidden');
        imageUploadInput.value = '';
        sendBtn.disabled = userInput.value.trim() === '';
    };
    const setLanguage = (lang, shouldStartNewChat = true) => {
        const strings = uiStrings[lang] || uiStrings['en-US'];
        const selectedOption = Array.from(languageSelector.options).find(opt => opt.value === lang);
        document.getElementById('ui-title').innerText = strings.title;
        document.getElementById('ui-subtitle').innerText = strings.subtitle.split(',')[0]; // Shorten subtitle
        userInput.placeholder = strings.placeholder;
        selectedLanguageLabel.innerText = selectedOption ? selectedOption.text : 'English';
        languageSelector.value = lang;
        localStorage.setItem('arogyaMitraLanguage', lang);
        if(shouldStartNewChat) {
            startNewChat();
        } else if (messages.length === 0) {
            addMessageToState(strings.welcome, 'bot', null, null, true);
        }
    };
    const applyTheme = (theme) => {
        document.documentElement.classList.toggle('dark', theme === 'dark');
        themeIconSun.classList.toggle('hidden', theme === 'dark');
        themeIconMoon.classList.toggle('hidden', theme !== 'dark');
    };
    
    // --- NEW Sidebar Toggle Logic ---
    const closeSidebarOnMobile = () => {
        if (window.innerWidth < 1024) {
            appWrapper.classList.remove('sidebar-open');
        }
    };

    sidebarToggleBtn.addEventListener('click', () => {
        appWrapper.classList.toggle('sidebar-open');
    });

    sidebarOverlay.addEventListener('click', () => {
        appWrapper.classList.remove('sidebar-open');
    });

    // ========================================================================
    // Initialization & Event Listeners
    // ========================================================================
    
    document.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        applyTheme(savedTheme);
        
        if (window.innerWidth >= 1024) {
            appWrapper.classList.add('sidebar-open');
        }
        
        window.addEventListener('beforeunload', saveChat);

        populateLanguageDropdown();
    });

    sendBtn.addEventListener("click", () => handleSend('text'));
    userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend('text'); }
    });
    userInput.addEventListener("input", () => {
        sendBtn.disabled = userInput.value.trim() === '' && !imageBase64;
    });
    
    stopBtn.addEventListener('click', stopAudio);
    settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
    closeModalBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));
    saveSettingsBtn.addEventListener('click', () => {
        userName = nameInput.value.trim();
        localStorage.setItem('arogyaMitraUserName', userName);
        settingsModal.classList.add('hidden');
    });

    uploadBtn.addEventListener('click', () => imageUploadInput.click());
    imageUploadInput.addEventListener('change', handleImageUpload);
    removeImageBtn.addEventListener('click', removeImage);
    
    newChatBtn.addEventListener('click', () => {
        startNewChat();
        closeSidebarOnMobile();
    });
    clearChatsBtn.addEventListener('click', clearAllChats);
    chatSearchInput.addEventListener('input', () => renderChatHistoryList(chatSearchInput.value));

    chatBox.addEventListener('click', (e) => {
        const copyBtn = e.target.closest('.copy-btn');
        if (copyBtn) {
            const textToCopy = document.querySelector(copyBtn.dataset.clipboardTarget).innerText;
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                copyBtn.innerHTML = '<svg class="w-4 h-4 text-green-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>';
                setTimeout(() => { copyBtn.innerHTML = '<svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" /></svg>'; }, 1500);
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
            document.body.removeChild(textArea);
        }
    });
    
    themeToggle.addEventListener('click', () => {
        const newTheme = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
        localStorage.setItem('theme', newTheme);
        applyTheme(newTheme);
    });
    
    const populateLanguageDropdown = () => {
        languageDropdown.innerHTML = '';
        Array.from(languageSelector.options).forEach(option => {
            const item = document.createElement('a');
            item.href = '#';
            item.textContent = option.textContent;
            item.dataset.value = option.value;
            item.className = 'block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-indigo-500 hover:text-white dark:hover:bg-indigo-500 transition-colors';
            item.addEventListener('click', (e) => { e.preventDefault(); setLanguage(item.dataset.value); languageDropdown.classList.add('hidden'); });
            languageDropdown.appendChild(item);
        });
    };

    languageSelectorButton.addEventListener('click', (e) => { e.stopPropagation(); languageDropdown.classList.toggle('hidden'); });
    document.addEventListener('click', (e) => {
        if (!languageSelectorButton.contains(e.target) && !languageDropdown.contains(e.target)) {
            languageDropdown.classList.add('hidden');
        }
    });
        
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isRecording = false;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.onstart = () => { isRecording = true; micBtn.classList.add('recording'); userInput.placeholder = uiStrings[languageSelector.value].listening; sendBtn.disabled = true; };
        recognition.onresult = (event) => {
            let finalTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) { finalTranscript += event.results[i][0].transcript; }
            }
            userInput.value = finalTranscript;
        };
        recognition.onerror = (event) => { console.error("Speech recognition error:", event.error); addMessageToState(`Speech recognition error: ${event.error}`, 'bot', null, null, true); };
        recognition.onend = () => { isRecording = false; micBtn.classList.remove('recording'); userInput.placeholder = uiStrings[languageSelector.value].placeholder; sendBtn.disabled = userInput.value.trim() === '' && !imageBase64; if (userInput.value.trim()) { handleSend('voice'); } };
    } else {
        micBtn.disabled = true;
    }
    micBtn.addEventListener('click', () => {
        if (!SpeechRecognition) return;
        if (isRecording) { recognition.stop(); } else { stopAudio(); recognition.lang = languageSelector.value; recognition.start(); }
    });
</script>
</body>
</html>
