<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArogyaMitra AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        #chat-box::-webkit-scrollbar {
            width: 6px;
        }
        #chat-box::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5);
            border-radius: 20px;
            border: 3px solid transparent;
        }
        .prose p {
            margin-bottom: 0.75rem;
        }
        .prose ul, .prose ol {
            margin-left: 1.25rem;
            margin-bottom: 0.75rem;
        }
        .prose li {
            margin-bottom: 0.25rem;
        }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
        .dot {
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot-1 { animation-delay: -0.32s; }
        .dot-2 { animation-delay: -0.16s; }
        /* Style for recording state */
        .recording {
            color: #ef4444; /* red-500 */
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased">

    <div class="flex flex-col h-screen max-w-3xl mx-auto px-4">
        <header class="py-6 text-center">
            <div class="flex items-center justify-center gap-4 relative">
                <h1 id="ui-title" class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 to-purple-600">
                    ArogyaMitra AI
                </h1>
                <div class="absolute right-0">
                    <select id="language-selector" class="bg-white border border-gray-300 text-gray-700 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-2">
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="hi">हिन्दी</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="te">తెలుగు</option>
                        <option value="ta">தமிழ்</option>
                        <option value="or">ଓଡିଆ</option>
                    </select>
                </div>
            </div>
            <p id="ui-subtitle" class="text-gray-500 mt-2">Trusted Health Guidance, Anytime, Anywhere</p>
        </header>

        <main id="chat-box" class="flex-1 overflow-y-auto pr-2 space-y-6">
            <!-- Welcome Message -->
            <div class="bot-message flex items-start gap-3">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex-shrink-0 flex items-center justify-center text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="m12 14-4-4"/><path d="M12 21a9 9 0 0 0 0-18 9 9 0 0 0 0 18Z"/></svg>
                </div>
                <div id="ui-welcome" class="prose max-w-none bg-white rounded-lg p-4 rounded-tl-none shadow-sm border border-gray-200">
                    <p>Welcome. I'm your AI Health Advisor. Ask me anything about symptoms, conditions, fitness, or nutrition.</p>
                </div>
            </div>
        </main>

        <footer class="py-4">
            <div class="relative bg-white border border-gray-300 rounded-xl shadow-sm">
                <input type="text" id="user-input" class="w-full bg-transparent text-gray-800 placeholder-gray-400 py-4 pl-5 pr-40 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-shadow" placeholder="Ask about a health topic...">
                
                <button id="stop-btn" class="absolute right-[96px] top-1/2 -translate-y-1/2 p-2 rounded-lg text-gray-500 hover:text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-white transition-colors hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12"></rect></svg>
                </button>

                <button id="mic-btn" class="absolute right-[52px] top-1/2 -translate-y-1/2 p-2 rounded-lg text-gray-500 hover:text-gray-800 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="22"></line>
                    </svg>
                </button>
                
                <button id="send-btn" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 rounded-lg bg-indigo-500 hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-white transition-colors disabled:opacity-50 disabled:cursor-not-allowed text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const languageSelector = document.getElementById("language-selector");
        const micBtn = document.getElementById("mic-btn");
        const stopBtn = document.getElementById("stop-btn");
        
        let chatHistory = [];
        let currentAudio = null;

        const uiStrings = {
            en: { title: "ArogyaMitra AI", subtitle: "Trusted Health Guidance, Anytime, Anywhere", welcome: "<p>Welcome. I'm your AI Health Advisor. Ask me anything about symptoms, conditions, fitness, or nutrition.</p>", placeholder: "Ask about a health topic..." },
            es: { title: "Asesor de Salud IA", subtitle: "Tu amigable recurso de salud impulsado por IA", welcome: "<p>Bienvenido. Soy tu Asesor de Salud de IA. Pregúntame cualquier cosa sobre síntomas, condiciones, fitness o nutrición.</p>", placeholder: "Pregunta sobre un tema de salud..." },
            hi: { title: "आरोग्यमित्र AI", subtitle: "आपका मित्र AI-संचालित स्वास्थ्य संसाधन", welcome: "<p>नमस्ते। मैं आपका AI स्वास्थ्य सलाहकार हूँ। मुझसे लक्षण, रोग, फिटनेस, या पोषण के बारे में कुछ भी पूछें।</p>", placeholder: "स्वास्थ्य विषय के बारे में पूछें..." },
            fr: { title: "Conseiller Santé IA", subtitle: "Votre ressource santé conviviale alimentée par l'IA", welcome: "<p>Bienvenue. Je suis votre conseiller en santé IA. Posez-moi des questions sur les symptômes, les conditions, la forme physique ou la nutrition.</p>", placeholder: "Posez une question sur un sujet de santé..." },
            de: { title: "KI-Gesundheitsberater", subtitle: "Ihre freundliche KI-gestützte Gesundheitsressource", welcome: "<p>Willkommen. Ich bin Ihr KI-Gesundheitsberater. Fragen Sie mich alles über Symptome, Krankheiten, Fitness oder Ernährung.</p>", placeholder: "Fragen Sie nach einem Gesundheitsthema..." },
            te: { title: "ఆరోగ్యమిత్ర AI", subtitle: "మీ స్నేహపూర్వక AI- ఆధారిత ఆరోగ్య వనరు", welcome: "<p>స్వాగతం. నేను మీ AI ఆరోగ్య సలహాదారుని. లక్షణాలు, పరిస్థితులు, ఫిట్‌నెస్ లేదా పోషణ గురించి నన్ను ఏదైనా అడగండి.</p>", placeholder: "ఆరోగ్య అంశం గురించి అడగండి..." },
            ta: { title: "ஆரோக்கியமித்ரா AI", subtitle: "உங்கள் நட்பு AI- శక్তితో పనিచేசే சுகாதార వளম்", welcome: "<p>வாருங்கள். நான் உங்கள் AI சுகাதார ஆலோசகர். அறிகুறிகள், நிபந்தனைகள், உடற்பயிற்சி அல்லது ஊட்டச்சத்து பற்றி என்னிடம் எதுவும் கேளுங்கள்.</p>", placeholder: "ஒரு சுகாதார தலைப்பு பற்றி கேளுங்கள்..." },
            or: { title: "ଆରୋଗ್যମିত్ର AI", subtitle: "ଆପଣଙ୍କର ବନ୍ଧୁତ୍ୱପୂର୍ଣ୍ଣ AI- ଚାଳିତ ସ୍ୱାସ୍ଥ୍ୟ ସମ୍ବଳ |", welcome: "<p>ସ୍ୱାଗତମ୍। ମୁଁ ଆପଣଙ୍କର AI ସ୍ୱାସ୍ଥ୍ୟ ପରାମର୍ଶଦାତା | ଲକ୍ଷଣ, ଅବସ୍ଥା, ଫିଟନେସ୍ କିମ୍ବା ପୁଷ୍ଟିକର ଖାଦ୍ୟ ବିଷୟରେ ମୋତେ କିଛି ପଚାରନ୍ତୁ |</p>", placeholder: "ଏକ ସ୍ୱାସ୍ଥ୍ୟ ବିଷୟରେ ପଚାରନ୍ତୁ ..." }
        };

        const setLanguage = (lang) => {
            const strings = uiStrings[lang] || uiStrings['en'];
            document.getElementById('ui-title').innerText = strings.title;
            document.getElementById('ui-subtitle').innerText = strings.subtitle;
            document.getElementById('ui-welcome').innerHTML = strings.welcome;
            userInput.placeholder = strings.placeholder;
            localStorage.setItem('preferredLanguage', lang);
        };

        languageSelector.addEventListener('change', (e) => setLanguage(e.target.value));

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('preferredLanguage') || 'en';
            languageSelector.value = savedLang;
            setLanguage(savedLang);
        });
        
        const stopAudio = () => {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
                stopBtn.classList.add('hidden');
            }
        };

        window.playAudio = (base64String) => {
            stopAudio();
            const audioSource = `data:audio/mp3;base64,${base64String}`;
            currentAudio = new Audio(audioSource);
            currentAudio.play();
            stopBtn.classList.remove('hidden');
            currentAudio.onended = () => {
                stopBtn.classList.add('hidden');
                currentAudio = null;
            };
        };
        
        stopBtn.addEventListener('click', stopAudio);

        const addMessage = (content, type, audioData = null) => {
            const messageWrapper = document.createElement("div");
            messageWrapper.className = `${type}-message flex items-start gap-3`;
            let messageHTML = '';
            
            const speakerIcon = `
                <button class="ml-2 text-gray-400 hover:text-indigo-500 transition-colors" onclick="playAudio('${audioData}')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                </button>
            `;

            if (type === 'user') {
                messageWrapper.classList.add('justify-end');
                messageHTML = `
                    <div class="prose max-w-none bg-blue-500 text-white rounded-lg p-4 rounded-br-none shadow-sm">
                        <p>${content}</p>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-gray-200 flex-shrink-0 flex items-center justify-center text-gray-500">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>`;
            } else {
                messageHTML = `
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex-shrink-0 flex items-center justify-center text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="m12 14-4-4"/><path d="M12 21a9 9 0 0 0 0-18 9 9 0 0 0 0 18Z"/></svg>
                    </div>
                    <div class="prose max-w-none bg-white rounded-lg p-4 rounded-tl-none flex items-center shadow-sm border border-gray-200">
                        <div class="text-gray-800">${content}</div>
                        ${audioData ? speakerIcon : ''}
                    </div>`;
            }
            messageWrapper.innerHTML = messageHTML;
            chatBox.appendChild(messageWrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        const showTypingIndicator = () => {
            const typingIndicatorHTML = `
                <div id="typing-indicator" class="bot-message flex items-start gap-3">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex-shrink-0 flex items-center justify-center text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="m12 14-4-4"/><path d="M12 21a9 9 0 0 0 0-18 9 9 0 0 0 0 18Z"/></svg>
                    </div>
                    <div class="bg-white rounded-lg p-4 rounded-tl-none flex items-center space-x-2 shadow-sm border border-gray-200">
                        <div class="dot dot-1 w-2.5 h-2.5 bg-gray-400 rounded-full"></div>
                        <div class="dot dot-2 w-2.5 h-2.5 bg-gray-400 rounded-full"></div>
                        <div class="dot dot-3 w-2.5 h-2.5 bg-gray-400 rounded-full"></div>
                    </div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', typingIndicatorHTML);
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        const hideTypingIndicator = () => {
            const indicator = document.getElementById("typing-indicator");
            if (indicator) indicator.remove();
        };

        const handleSend = async (source = 'text') => {
            const question = userInput.value.trim();
            if (!question) return;

            stopAudio();
            addMessage(question, 'user');
            chatHistory.push({ role: "user", parts: [{ text: question }] });
            
            userInput.value = "";
            sendBtn.disabled = true;

            showTypingIndicator();

            try {
                const selectedLanguage = languageSelector.value;
                const response = await fetch("/ask", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        language: selectedLanguage,
                        history: chatHistory.slice(0, -1),
                        source: source
                    }),
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const botAnswer = data.answer;
                const audioData = data.audio;
            
                hideTypingIndicator();
                addMessage(marked.parse(botAnswer), 'bot', audioData);
                
                if (audioData) {
                    playAudio(audioData);
                }

                chatHistory.push({ role: "model", parts: [{ text: botAnswer }] });

            } catch (error) {
                console.error("Error fetching response:", error);
                hideTypingIndicator();
                addMessage(`Sorry, something went wrong. Please try again. <br><small class="text-red-500">${error.message}</small>`, 'bot');
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        };

        sendBtn.addEventListener("click", () => handleSend('text'));
        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                handleSend('text');
            }
        });

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        micBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    // Request audio with optimal constraints for speech recognition
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            channelCount: 1, // Mono audio
                            sampleRate: 16000, // 16kHz sample rate for better compatibility
                            sampleSize: 16, // 16-bit samples
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true
                        } 
                    });
                    
                    // Use WAV format if available, fallback to webm
                    let options = {};
                    if (MediaRecorder.isTypeSupported('audio/wav')) {
                        options.mimeType = 'audio/wav';
                    } else if (MediaRecorder.isTypeSupported('audio/webm;codecs=pcm')) {
                        options.mimeType = 'audio/webm;codecs=pcm';
                    } else if (MediaRecorder.isTypeSupported('audio/webm')) {
                        options.mimeType = 'audio/webm';
                    }
                    
                    mediaRecorder = new MediaRecorder(stream, options);
                    console.log('Using MIME type:', mediaRecorder.mimeType);
                    
                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('recording');
                    userInput.placeholder = "Listening... (speak clearly)";
                    
                    // Auto-stop after 30 seconds
                    const autoStopTimeout = setTimeout(() => {
                        if (isRecording && mediaRecorder && mediaRecorder.state === "recording") {
                            console.log("Auto-stopping recording after 30 seconds");
                            mediaRecorder.stop();
                        }
                    }, 30000);
                    
                    mediaRecorder.addEventListener("stop", async () => {
                        clearTimeout(autoStopTimeout);
                        
                        const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                        audioChunks = [];
                        stream.getTracks().forEach(track => track.stop());
                        
                        console.log('Recorded audio blob size:', audioBlob.size, 'bytes');
                        console.log('Recorded audio type:', audioBlob.type);
                        
                        if (audioBlob.size < 2000) {
                            console.log("Recording too small, likely empty or too short.");
                            addMessage("Recording was too short or empty. Please try again and speak clearly.", 'bot');
                            setLanguage(languageSelector.value);
                            return;
                        }

                        userInput.placeholder = "Processing your voice...";
                        
                        const selectedLanguage = languageSelector.value;
                        const formData = new FormData();
                        
                        // Determine file extension based on MIME type
                        let fileExtension = 'webm';
                        if (audioBlob.type.includes('wav')) {
                            fileExtension = 'wav';
                        } else if (audioBlob.type.includes('mp3')) {
                            fileExtension = 'mp3';
                        }
                        
                        formData.append("audio_data", audioBlob, `recording.${fileExtension}`);
                        formData.append("language", selectedLanguage);

                        try {
                            const response = await fetch("/transcribe", {
                                method: "POST",
                                body: formData,
                            });
                            
                            if (!response.ok) {
                                const errData = await response.json();
                                throw new Error(errData.error || `Transcription failed with status: ${response.status}`);
                            }

                            const data = await response.json();
                            console.log('Transcription result:', data.transcription);
                            
                            if (data.transcription && data.transcription.trim()) {
                                userInput.value = data.transcription;
                                handleSend('voice');
                            } else {
                                addMessage("I couldn't understand what you said. Please try speaking more clearly or check your microphone.", 'bot');
                            }
                            
                        } catch (error) {
                            console.error("Error sending audio:", error);
                            addMessage(`Sorry, could not process your voice input: ${error.message}`, 'bot');
                        } finally {
                            setLanguage(languageSelector.value);
                        }
                    });

                    mediaRecorder.addEventListener("dataavailable", event => {
                        if (event.data && event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    });

                } catch (err) {
                    console.error("Error accessing microphone:", err);
                    addMessage("Could not access the microphone. Please grant permission and try again.", 'bot');
                }
            } else {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                }
                isRecording = false;
                micBtn.classList.remove('recording');
            }
        });

    </script>
</body>
</html>
